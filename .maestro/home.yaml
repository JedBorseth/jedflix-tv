appId: com.jedflix.tv
name: Home catalog smoke test
---
- launchApp:
    clearState: false

# Skeleton dismisses once TMDB responds; assert real catalog content is on screen.
- extendedWaitUntil:
    visible:
      id: "catalog"
    timeout: 30000
- assertVisible: "Trending Now"
- assertVisible:
    id: "billboard"
- assertVisible:
    id: "poster-card"
- assertNotVisible:
    id: "catalog-skeleton"

# Fresh Home starts on Billboard Play. Enter a poster and open Detail.
- pressKey: Remote Dpad Down
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "detail-play"
    timeout: 30000
- assertVisible:
    id: "detail-like"
- assertVisible:
    id: "detail-not-interested"
- pressKey: Back
- assertVisible:
    id: "catalog"
- pressKey: Remote Dpad Left
- pressKey: Back
- assertVisible:
    id: "catalog"
# Back on Home with a closed drawer keeps the app open.
- pressKey: Back
- assertVisible:
    id: "catalog"
