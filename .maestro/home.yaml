appId: com.jedflix.tv
name: Home catalog smoke test
---
- launchApp:
    clearState: false

# Splash plays ~2s on its own; pressing select skips it so the flow doesn't depend on timing.
- extendedWaitUntil:
    visible:
      id: "splash"
    timeout: 5000
    optional: true
- pressKey: Enter

# Skeleton dismisses once TMDB responds; assert real catalog content is on screen.
- extendedWaitUntil:
    visible:
      id: "catalog"
    timeout: 30000
- assertVisible: "Jed's Movies"
- assertVisible:
    id: "billboard"
- assertVisible:
    id: "poster-card"
- assertNotVisible:
    id: "catalog-skeleton"

# Focus starts on the first editorial shelf. D-pad down reveals the next rails.
- repeat:
    while:
      notVisible: "Crave Movies"
    times: 6
    commands:
      - pressKey: Remote Dpad Down
- assertVisible: "Crave Movies"
