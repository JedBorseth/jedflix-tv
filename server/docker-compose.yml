# Runs on the Linux box next to the JedFlix stack. Copy this file to
# ~/jedflix-tv-api/docker-compose.yml once; CI refreshes it and pulls both
# API and recommender images at the SHA it just pushed on server changes.
#
# No host port is published. Caddy (in the jedflix compose project) reaches
# this container as jedflix-tv-api:8080 over the shared jedflix_default network
# and exposes it at https://<domain>/tv-api/.
#
# Trailer clips live on disk1 (not in the image):
#   /mnt/disk1/jedflix/tv-clips/{youtubeKey}.mp4
# Public URL: https://borseth.ddns.net/tv-api/clips/{youtubeKey}.mp4
#
# clipgen is a one-shot job (profile `clipgen`), not started by `up -d`:
#   docker compose --profile clipgen run --rm clipgen --limit 1
# Nightly cron: 0 4 * * * cd ~/jedflix-tv-api && docker compose --profile clipgen run --rm clipgen
services:
  api:
    image: ghcr.io/jedborseth/jedflix-tv/api:${TV_API_TAG:-latest}
    container_name: jedflix-tv-api
    restart: unless-stopped
    environment:
      ADDR: ":8080"
      CLIP_DIR: /clips
      RECOMMENDATIONS_URL: http://recommender:8090
    volumes:
      - ${CLIP_HOST_DIR:-/mnt/disk1/jedflix/tv-clips}:/clips:ro
    networks:
      - jedflix
      - recommendations
    depends_on:
      recommender:
        # Clips and health remain usable while the model warms or is unavailable.
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  recommender:
    image: ghcr.io/jedborseth/jedflix-tv/recommender:${TV_API_TAG:-latest}
    container_name: jedflix-tv-recommender
    restart: unless-stopped
    cpus: 2
    mem_limit: 2g
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:?TMDB_API_KEY is required for recommendations}
      MODEL_THREADS: 2
      MODEL_CACHE_DIR: /data/models
      CONTENT_CACHE_DB: /data/content.sqlite3
    volumes:
      - ${RECOMMENDATION_HOST_DIR:-/mnt/disk1/jedflix/tv-recommendations}:/data
    networks:
      - recommendations
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  clipgen:
    image: ghcr.io/jedborseth/jedflix-tv/api:${TV_API_TAG:-latest}
    profiles: ["clipgen"]
    user: "1000:1000"
    environment:
      CLIP_DIR: /clips
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      YTDLP_COOKIES: ${YTDLP_COOKIES:-}
    volumes:
      - ${CLIP_HOST_DIR:-/mnt/disk1/jedflix/tv-clips}:/clips
    networks:
      - jedflix
    entrypoint: ["/app/clipgen"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  recommendations:
  jedflix:
    external: true
    name: ${JEDFLIX_NETWORK:-jedflix_default}
